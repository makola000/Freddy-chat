<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freddy Makola Chat</title>
<style>
body{font-family:Arial;background:#0f172a;color:white;margin:0;padding:20px}
h1{color:#22c55e;text-align:center}
#chat{max-width:600px;margin:20px auto;background:#1e293b;padding:15px;border-radius:12px;height:400px;overflow-y:auto}
.msg{margin:10px 0;padding:10px;border-radius:8px}
.user{background:#22c55e;color:black;text-align:right}
.bot{background:#334155}
input{width:75%;padding:12px;border-radius:8px;border:none}
button{width:20%;padding:12px;background:#22c55e;border:none;border-radius:8px;font-weight:bold}
.box{max-width:600px;margin:0 auto;display:flex;gap:10px}
</style>
</head>
<body>
<h1>💬 Freddy Makola Chat</h1>
<div id="chat"><div class="msg bot">Salut ! Je suis Freddy. Comment je peux aider l'équipe ?</div></div>
<div class="box"><input id="in" placeholder="Écris ici..."><button onclick="send()">Envoyer</button></div>
<script>
function send(){
 let i=document.getElementById('in');
 let c=document.getElementById('chat');
 if(!i.value)return;
 c.innerHTML+=`<div class="msg user">${i.value}</div>`;
 let r="Reçu : "+i.value+" - L'équipe va te répondre !";
 setTimeout(()=>{c.innerHTML+=`<div class="msg bot">${r}</div>`;c.scrollTop=c.scrollHeight},300);
 i.value="";c.scrollTop=c.scrollHeight
}
</script>
</body>
</html>
