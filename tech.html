<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freddy Chat</title>
<style>
body{margin:0;font-family:Arial;background:#111b21;color:white}
.header{background:#202c33;padding:15px;text-align:center;font-size:20px;font-weight:bold;color:#00a884}
#chat{height:80vh;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:70%;padding:10px 14px;border-radius:12px}
.me{align-self:flex-end;background:#005c4b}
.other{align-self:flex-start;background:#202c33}
.bar{position:fixed;bottom:0;width:100%;display:flex;padding:10px;background:#202c33;gap:10px;box-sizing:border-box}
input{flex:1;padding:12px;border-radius:20px;border:none;outline:none}
button{background:#00a884;border:none;color:white;padding:12px 20px;border-radius:20px;font-weight:bold}
</style>
</head>
<body>
<div class="header">🔥 Freddy Chat - Équipe Interne</div>
<div id="chat"></div>
<div class="bar">
<input id="pseudo" placeholder="Ton nom" style="max-width:100px">
<input id="message" placeholder="Message...">
<button onclick="envoyer()">Envoyer</button>
</div>
<script>
const chatDiv = document.getElementById('chat');
let messages = JSON.parse(localStorage.getItem('freddy_msgs')||'[]');
function afficher(){
 chatDiv.innerHTML='';
 messages.forEach(m=>{
   const div=document.createElement('div');
   div.className='msg '+(m.pseudo===document.getElementById('pseudo').value?'me':'other');
   div.innerHTML=`<b>${m.pseudo}</b><br>${m.text}`;
   chatDiv.appendChild(div);
 });
 chatDiv.scrollTop=chatDiv.scrollHeight;
}
function envoyer(){
 const p=document.getElementById('pseudo').value||'Anonyme';
 const t=document.getElementById('message').value;
 if(!t) return;
 messages.push({pseudo:p,text:t,time:Date.now()});
 localStorage.setItem('freddy_msgs',JSON.stringify(messages));
 document.getElementById('message').value='';
 afficher();
}
afficher();
setInterval(()=>{messages=JSON.parse(localStorage.getItem('freddy_msgs')||'[]');afficher();},1000);
</script>
</body>
</html>
